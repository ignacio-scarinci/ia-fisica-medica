project:
  type: website
  render:
    - "*.qmd"
    - "unidad*/*.qmd"
    - "!**/notebooks/"
  # No definimos output-dir: Quarto renderiza en _site/ (que va en .gitignore).
  # El sitio final se publica en la rama gh-pages, no en main.

website:
  title: "IA en Física Médica"
  description: "Curso de posgrado — Inteligencia Artificial en Física Médica"
  page-navigation: true
  reader-mode: true
  navbar:
    background: primary
    left:
      - href: index.qmd
        text: Inicio
      - href: unidad0/notas.qmd
        text: Unidad 0  
      # - href: unidad1/notas.qmd
      #   text: Unidad 1
    right:
      - icon: github
        href: https://github.com/ignacio-scarinci/ia-fisica-medica

  sidebar:
    style: "docked"
    search: true
    background: light
    contents:
      - text: "---"
      - section: "0.  Introducción"
        contents:
          - text: "Notas de clase"
            href: unidad0/notas.qmd
          - text: "Calendario"
            href: unidad0/calendario.qmd
          - text: "Presentación"
            href: unidad0/presentacion.qmd
      - text: "---"
      - section: "1. Fundamentos de IA"
        contents:
          - text: "Notas de clase"
            href: unidad1/notas.qmd
          - text: "Notas sobre imágenes médicas"
            href: unidad1/notas2.qmd
          - text: "Presentación"
            href: unidad1/presentacion.qmd
          - text: "Notebook 0"
            href: unidad1/notebooks/Notebook0.ipynb
          - text: "Notebook 1"
            href: unidad1/notebooks/Notebook1.ipynb

format:
  html:
    theme: cerulean
    toc: true
    number-sections: true
    css: styles.css

execute:
  freeze: auto  # evita re-ejecutar código si el .qmd no cambió
